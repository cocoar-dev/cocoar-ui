<div class="coar-password-input-wrapper">
  <!-- Label -->
  @if (label()) {
  <label [for]="inputId()" class="coar-password-input-label">
    {{ label() }}
    @if (required()) {
    <span class="coar-password-input-required">*</span>
    }
  </label>
  }

  <!-- Input Container -->
  <div
    class="coar-password-input-container"
    [class.coar-password-input-focused]="isFocused()"
    [class.coar-password-input-disabled]="disabled()"
    [class.coar-password-input-readonly]="readonly()"
    [class.coar-password-input-error]="hasError()"
  >
    <!-- Input Element -->
    <input
      #inputElement
      [id]="inputId()"
      [name]="name()"
      [type]="inputType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      [required]="required()"
      [autocomplete]="autocomplete()"
      [attr.maxlength]="maxlength()"
      [attr.aria-describedby]="displayMessage() ? messageId() : null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      class="coar-password-input-field"
      (input)="onInput($event)"
      (focus)="onFocus($event)"
      (blur)="onBlur($event)"
    />

    <!-- Clear indicator -->
    @if (showClearButton()) {
    <coar-icon name="x" size="auto" class="coar-password-input-clear" aria-hidden="true" (click)="onClear()" />
    }

    <!-- Toggle Visibility -->
    <coar-icon
      [name]="toggleIcon()"
      size="auto"
      class="coar-password-input-toggle"
      [attr.aria-label]="toggleAriaLabel()"
      aria-hidden="true"
      (click)="togglePasswordVisibility()"
    />
  </div>

  <!-- Hint/Error Message -->
  @if (displayMessage()) {
  <div [id]="messageId()" class="coar-password-input-message" [class.coar-password-input-message-error]="hasError()">
    {{ displayMessage() }}
  </div>
  }
</div>
