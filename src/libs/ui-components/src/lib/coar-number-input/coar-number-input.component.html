<div class="coar-number-input-wrapper">
  <!-- Label -->
  @if (label()) {
  <label
    [for]="inputId()"
    class="coar-number-input-label"
    [class.coar-number-input-label--draggable]="!disabled() && !readonly()"
    (mousedown)="onDragStart($event)"
  >
    {{ label() }}
    @if (required()) {
    <span class="coar-number-input-required">*</span>
    }
  </label>
  }

  <!-- Input Container -->
  <div
    class="coar-number-input-container"
    [class.coar-number-input-focused]="isFocused()"
    [class.coar-number-input-disabled]="disabled()"
    [class.coar-number-input-readonly]="readonly()"
    [class.coar-number-input-error]="hasError()"
    [class.coar-number-input-dragging]="isDragging()"
  >
    <!-- Clear indicator (left side for number input) - always present to prevent CLS -->
    <coar-icon
      name="x"
      size="auto"
      class="coar-number-input-clear"
      [class.coar-number-input-clear--hidden]="!showClearButton()"
      aria-hidden="true"
      (click)="onClear()"
    />

    <!-- Prefix -->
    <span class="coar-number-input-prefix">
      @if (prefix()) {
      {{ prefix() }}
      }
      <ng-content select="[prefix]"></ng-content>
    </span>

    <!-- Input Element -->
    <input
      #inputElement
      [id]="inputId()"
      [name]="name()"
      type="text"
      inputmode="decimal"
      [value]="displayValue()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      [required]="required()"
      [attr.aria-describedby]="displayMessage() ? messageId() : null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-valuemin]="min()"
      [attr.aria-valuemax]="max()"
      [attr.aria-valuenow]="value()"
      class="coar-number-input-field"
      (input)="onInput($event)"
      (focus)="onFocus($event)"
      (blur)="onBlur($event)"
      (keydown)="onKeyDown($event)"
    />

    <!-- Suffix -->
    <span class="coar-number-input-suffix">
      @if (suffix()) {
      {{ suffix() }}
      }
      <ng-content select="[suffix]"></ng-content>
    </span>

    <!-- Increment/Decrement Buttons -->
    @if ((showIncrementButton() || showDecrementButton()) && !disabled() && !readonly()) {
    <div class="coar-number-input-buttons">
      @if (showDecrementButton()) {
      <button
        type="button"
        class="coar-number-input-button coar-number-input-button--decrement"
        [disabled]="!canDecrement()"
        aria-label="Decrease value"
        (click)="decrement()"
        tabindex="-1"
      >
        <coar-icon name="minus" [size]="iconSize()"></coar-icon>
      </button>
      } @if (showIncrementButton()) {
      <button
        type="button"
        class="coar-number-input-button coar-number-input-button--increment"
        [disabled]="!canIncrement()"
        aria-label="Increase value"
        (click)="increment()"
        tabindex="-1"
      >
        <coar-icon name="plus" [size]="iconSize()"></coar-icon>
      </button>
      }
    </div>
    }
  </div>

  <!-- Hint/Error Message -->
  @if (displayMessage()) {
  <div [id]="messageId()" class="coar-number-input-message" [class.coar-number-input-message-error]="hasError()">
    {{ displayMessage() }}
  </div>
  }
</div>
