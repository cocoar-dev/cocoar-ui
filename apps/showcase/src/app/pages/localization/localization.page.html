<div class="component-page">
  <header class="page-header">
    <h1 class="coar-title">Localization</h1>
    <p class="description coar-body">Complete localization system covering translations (i18n) and locale formatting (L10n) for Angular applications.</p>
  </header>

  <coar-tab-group [activeTab]="activeTab" (activeTabChange)="activeTab = $event">
    <coar-tab id="overview" [content]="OverviewTab">Overview</coar-tab>
    <coar-tab id="setup" [content]="SetupTab">Setup</coar-tab>
    <coar-tab id="usage" [content]="UsageTab">Usage</coar-tab>
  </coar-tab-group>
</div>
