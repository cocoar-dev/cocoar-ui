name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Volta (Node + pnpm)
        uses: volta-cli/action@v4
        with:
          package-json-path: ./package.json

      - name: Install Node.js
        run: volta install node

      - name: Install pnpm
        run: volta install pnpm

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v3

      - name: Log calculated version
        run: echo "GitVersion calculated version ${{ steps.gv.outputs.SemVer }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate scenario registry
        run: pnpm nx generate-registry scenar-backstage

      - name: Test
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

      - name: Check undeclared CSS variables
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $output = & ./scripts/css/find-undeclared-css-vars.ps1 -OutputFormat list 2>&1 | Out-String
          Write-Host $output
          $summary = "### CSS Variable Check`n`````n$output`n`````n"
          $summary | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Check unused CSS (showcase)
        if: ${{ !cancelled() }}
        run: |
          output=$(node scripts/css/find-unused-css.mjs 2>&1) || true
          echo "$output"
          {
            echo "### Unused CSS Check"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm e2e
        env:
          COAR_E2E_BROWSERS: chromium
          SCENARIO_SERVER_COMMAND: "pnpm exec nx serve scenar-backstage"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/showcase-e2e/playwright-report/
          retention-days: 7
