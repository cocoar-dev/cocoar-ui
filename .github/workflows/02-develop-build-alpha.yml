name: Develop - Push

on:
  push:
    branches: [develop]

jobs:
  build-and-pack-alpha:
    name: Lint, Test, Build & Pack Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Volta (Node + pnpm)
        uses: volta-cli/action@v4
        with:
          package-json-path: ./package.json

      - name: Install Node.js
        run: volta install node

      - name: Install pnpm
        run: volta install pnpm

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate scenario registry
        run: pnpm nx generate-registry scenar-backstage

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Update package versions
        run: |
          VERSION="${{ steps.gv.outputs.SemVer }}"
          echo "Setting version to: $VERSION"

          # Update version in all publishable package.json files
          for pkg in dist/libs/*/package.json; do
            if [ -f "$pkg" ]; then
              echo "Updating $pkg to version $VERSION"
              jq --arg v "$VERSION" '.version = $v' "$pkg" > tmp.json && mv tmp.json "$pkg"
            fi
          done

      - name: Update meta-package dependencies
        run: |
          VERSION="${{ steps.gv.outputs.SemVer }}"
          META_PKG="dist/libs/ui/package.json"
          if [ -f "$META_PKG" ]; then
            echo "Updating @cocoar/ui dependencies to $VERSION"
            jq --arg v "$VERSION" '
              .dependencies |= with_entries(
                if .key | startswith("@cocoar/") then .value = $v else . end
              )
            ' "$META_PKG" > tmp.json && mv tmp.json "$META_PKG"
            echo "Updated dependencies:"
            jq -r '.dependencies | to_entries[] | select(.key | startswith("@cocoar/")) | "  \(.key): \(.value)"' "$META_PKG"
          fi

      - name: Pack npm packages
        run: |
          mkdir -p artifacts
          for pkg_dir in dist/libs/*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/package.json" ]; then
              echo "Packing $pkg_dir"
              (cd "$pkg_dir" && npm pack --pack-destination ../../../artifacts)
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-${{ steps.gv.outputs.SemVer }}
          path: artifacts
          retention-days: 7
