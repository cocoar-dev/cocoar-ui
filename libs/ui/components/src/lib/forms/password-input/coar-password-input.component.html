<div class="coar-password-input-wrapper">
  <!-- Label -->
  @if (label()) {
    <label [for]="inputId()" class="coar-password-input-label">
      {{ label() }}
      @if (required()) {
        <span class="coar-password-input-required">*</span>
      }
    </label>
  }

  <!-- Input Container -->
  <div
    class="coar-password-input-container"
    [class.coar-password-input-focused]="isFocused()"
    [class.coar-password-input-disabled]="isDisabled()"
    [class.coar-password-input-readonly]="readonly()"
    [class.coar-password-input-error]="hasError()"
  >
    <!-- Input Element -->
    <input
      #inputElement
      [id]="inputId()"
      [name]="name()"
      [type]="inputType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readonly]="readonly()"
      [required]="required()"
      [autocomplete]="autocomplete()"
      [attr.maxlength]="maxlength()"
      [attr.aria-describedby]="displayMessage() ? messageId() : null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      class="coar-password-input-field"
      (input)="onInput($event)"
      (focus)="onFocus($event)"
      (blur)="onBlur($event)"
    />

    <!-- Clear indicator -->
    @if (showClearButton()) {
      <button type="button" class="coar-password-input-clear" tabindex="-1" aria-label="Clear" (click)="onClear()">
        <coar-icon name="x" source="coar-builtin" size="auto" />
      </button>
    }

    <!-- Toggle Visibility -->
    <button type="button" class="coar-password-input-toggle" tabindex="-1" [attr.aria-label]="toggleAriaLabel()" (click)="togglePasswordVisibility()">
      <coar-icon [name]="toggleIcon()" source="coar-builtin" size="auto" />
    </button>
  </div>

  <!-- Hint/Error Message (always rendered, 1 line reserved) -->
  <div [id]="messageId()"
       class="coar-form-field-message"
       [class.coar-form-field-message--error]="hasError()"
       [attr.title]="displayMessage() || null">
    {{ displayMessage() }}
  </div>
</div>
