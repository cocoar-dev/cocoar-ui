<div class="coar-text-input-wrapper">
  <!-- Label -->
  @if (label()) {
    <label [for]="inputId()" class="coar-text-input-label">
      {{ label() }}
      @if (required()) {
        <span class="coar-text-input-required">*</span>
      }
    </label>
  }

  <!-- Input Container -->
  <div
    class="coar-text-input-container"
    [class.coar-text-input-focused]="isFocused()"
    [class.coar-text-input-disabled]="isDisabled()"
    [class.coar-text-input-readonly]="readonly()"
    [class.coar-text-input-error]="hasError()"
  >
    <!-- Prefix (only for single-line) -->
    @if (!isMultiline()) {
      <span class="coar-text-input-prefix">
        @if (prefix()) {
          {{ prefix() }}
        }
        <ng-content select="[prefix]"></ng-content>
      </span>
    }

    <!-- Input Element (single-line) -->
    @if (!isMultiline()) {
      <input
        #inputElement
        [id]="inputId()"
        [name]="name()"
        type="text"
        [value]="value()"
        [placeholder]="placeholder()"
        [disabled]="isDisabled()"
        [readonly]="readonly()"
        [required]="required()"
        [autocomplete]="autocomplete()"
        [attr.maxlength]="maxlength()"
        [attr.aria-describedby]="displayMessage() ? messageId() : null"
        [attr.aria-invalid]="hasError() ? 'true' : null"
        class="coar-text-input-field"
        (input)="onInput($event)"
        (focus)="onFocus($event)"
        (blur)="onBlur($event)"
      />
    }

    <!-- Textarea (multiline) -->
    @if (isMultiline()) {
      <textarea
        #inputElement
        [id]="inputId()"
        [name]="name()"
        [value]="value()"
        [placeholder]="placeholder()"
        [disabled]="isDisabled()"
        [readonly]="readonly()"
        [required]="required()"
        [attr.maxlength]="maxlength()"
        [attr.aria-describedby]="displayMessage() ? messageId() : null"
        [attr.aria-invalid]="hasError() ? 'true' : null"
        [rows]="rows()"
        class="coar-text-input-field coar-text-input-textarea"
        (input)="onInput($event)"
        (focus)="onFocus($event)"
        (blur)="onBlur($event)"
      ></textarea>
    }

    <!-- Suffix (only for single-line) -->
    @if (!isMultiline()) {
      <span class="coar-text-input-suffix">
        @if (suffix()) {
          {{ suffix() }}
        }
        <ng-content select="[suffix]"></ng-content>
      </span>
    }

    <!-- Clear indicator -->
    @if (showClearButton()) {
      <coar-icon
        name="x"
        source="coar-builtin"
        size="auto"
        class="coar-text-input-clear"
        [class.coar-text-input-clear--multiline]="isMultiline()"
        aria-hidden="true"
        (click)="onClear()"
      />
    }

    <!-- Suffix Actions (always visible, e.g., action buttons) -->
    @if (!isMultiline()) {
      <span class="coar-text-input-suffix-actions">
        <ng-content select="[suffixAction]"></ng-content>
      </span>
    }
  </div>

  <!-- Hint/Error Message (always rendered, 1 line reserved) -->
  <div [id]="messageId()"
       class="coar-form-field-message"
       [class.coar-form-field-message--error]="hasError()"
       [attr.title]="displayMessage() || null">
    {{ displayMessage() }}
  </div>
</div>
