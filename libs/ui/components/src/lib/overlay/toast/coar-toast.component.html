<div class="coar-toast"
     [class]="'coar-toast--' + variant()"
     (mouseenter)="onMouseEnter()"
     (mouseleave)="onMouseLeave()"
     [attr.role]="variant() === 'error' ? 'alert' : null">
  <div class="coar-toast-icon">
    <coar-icon [name]="iconName()" size="s" />
  </div>
  <div class="coar-toast-content">
    @if (title()) {
    <div class="coar-toast-title">{{ title() }}</div>
    }
    <div class="coar-toast-message">{{ message() }}</div>
  </div>
  <div class="coar-toast-actions">
    @if (action()) {
    <button class="coar-toast-action-btn" (click)="onAction()" [attr.aria-label]="action()!.label">
      {{ action()!.label }}
    </button>
    }
    @if (dismissible()) {
    <button class="coar-toast-close" (click)="onDismiss()" aria-label="Dismiss notification">
      <coar-icon name="x" size="xs" />
    </button>
    }
  </div>
  @if (showProgress() && duration() > 0) {
  <div class="coar-toast-progress">
    <div class="coar-toast-progress-bar"
         [style.animation-duration.ms]="duration()"
         [class.coar-toast-progress-bar--paused]="isPaused()"></div>
  </div>
  }
</div>
