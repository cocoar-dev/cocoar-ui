<div class="coar-date-time-picker-wrapper">
  <!-- Label -->
  @if (label()) {
    <span class="coar-date-time-picker-label" [attr.id]="labelId()">
      {{ label() }}
      @if (required()) {
        <span class="coar-date-time-picker-required" aria-hidden="true">*</span>
      }
    </span>
  }

  <!-- Trigger -->
  <div
    #trigger
    class="coar-date-time-picker-trigger"
    [class.coar-date-time-picker-trigger--disabled]="isDisabled()"
    [class.coar-date-time-picker-trigger--readonly]="readonly()"
    [class.coar-date-time-picker-trigger--error]="hasError()"
    [class.coar-date-time-picker-trigger--open]="isOpen()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="'dialog'"
    [attr.aria-controls]="isOpen() ? panelId() : null"
    role="combobox"
  >
    <!-- Clear Button (left side) -->
    <coar-icon
      name="x"
      source="coar-builtin"
      size="auto"
      class="coar-date-time-picker-clear"
      [class.coar-date-time-picker-clear--hidden]="!showClearButton()"
      aria-hidden="true"
      (click)="clearValue($event)"
    />

    <!-- Input -->
    <input
      #dateInput
      type="text"
      class="coar-date-time-picker-input"
      [attr.id]="inputId()"
      [value]="displayValue()"
      [placeholder]="placeholder() || inputPlaceholder()"
      [disabled]="isDisabled()"
      [readonly]="readonly()"
      [attr.aria-labelledby]="label() ? labelId() : null"
      [attr.aria-invalid]="hasError()"
      autocomplete="off"
      (input)="onInputChange($event)"
      (blur)="onInputBlur()"
      (keydown)="onTriggerKeydown($event)"
    />

    <!-- Calendar Icon -->
    <button
      type="button"
      class="coar-date-time-picker-btn"
      aria-label="Open picker"
      [disabled]="isDisabled() || readonly()"
      (click)="onTriggerClick()"
    >
      <coar-icon name="calendar" source="coar-builtin" size="sm" />
    </button>
  </div>

  <!-- Panel (rendered via @cocoar/ui-overlay) -->
  <ng-template #panelTemplate>
    <div class="coar-date-time-picker-panel" [attr.id]="panelId()" role="dialog" aria-modal="true" aria-label="Date time picker">
      <!-- Left Column: Scrollable Calendar -->
      <div class="coar-date-time-picker-calendar-column">
        <coar-scrollable-calendar
          [value]="selectedDate()"
          [(activeMonth)]="activeMonth"
          [min]="minDate()"
          [max]="maxDate()"
          [locale]="effectiveLocale()"
          [dateFormatConfig]="effectiveDateFormat()"
          [showWeekNumbers]="showWeekNumbers()"
          [highlightWeekends]="highlightWeekends()"
          [markers]="markers()"
          (dateSelected)="onDateSelected($event)"
        />
        @if (showTodayButton() && todayButtonDirection() !== 'hidden') {
          <button type="button" class="coar-date-time-picker-today-fab" (click)="scrollToToday()" aria-label="Go to today">
            <coar-icon [name]="todayButtonDirection()" size="sm" />
          </button>
        }
      </div>

      <!-- Right Column: Month List + Time Picker -->
      <div class="coar-date-time-picker-side-column">
        <!-- Year Stepper -->
        <div class="coar-date-time-picker-year-stepper">
          <button
            type="button"
            class="coar-date-time-picker-year-btn"
            [disabled]="isPrevYearDisabled()"
            (click)="previousYear()"
            aria-label="Previous year"
          >
            <coar-icon name="left" size="sm" />
          </button>
          <span class="coar-date-time-picker-year">{{ currentYear() }}</span>
          <button type="button" class="coar-date-time-picker-year-btn" [disabled]="isNextYearDisabled()" (click)="nextYear()" aria-label="Next year">
            <coar-icon name="right" size="sm" />
          </button>
        </div>

        <!-- Month List (2-column grid) -->
        <div class="coar-date-time-picker-month-list-wrapper">
          <div class="coar-date-time-picker-month-list" role="listbox" aria-label="Months">
            <div class="coar-date-time-picker-month-list-content">
              @for (item of monthItems(); track item.month) {
                <button
                  type="button"
                  class="coar-date-time-picker-month-item"
                  [class.coar-date-time-picker-month-item--active]="item.isActive"
                  role="option"
                  [attr.aria-selected]="item.isActive"
                  (click)="selectMonth(item.yearMonth)"
                >
                  {{ item.name }}
                </button>
              }
            </div>
          </div>
        </div>

        <!-- Time Picker (datetime mode only) -->
        @if (mode() === 'datetime') {
          <div class="coar-date-time-picker-time-section">
            <coar-time-picker
              [value]="selectedTime()"
              [use24Hour]="use24Hour()"
              [minuteStep]="minuteStep()"
              [locale]="effectiveLocale()"
              [disabled]="isDisabled()"
              [readonly]="readonly()"
              (valueChange)="onTimeChanged($event)"
            />
          </div>
        }
      </div>
    </div>
  </ng-template>

  <!-- Helper/Error Message -->
  @if (message()) {
    <span class="coar-date-time-picker-message" [class.coar-date-time-picker-message--error]="hasError()">
      {{ message() }}
    </span>
  }
</div>
