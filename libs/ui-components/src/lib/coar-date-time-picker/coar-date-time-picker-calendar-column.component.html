<div class="coar-date-time-picker-calendar-column">
  <coar-scrollable-calendar
    [value]="value()"
    [activeMonth]="activeMonth()"
    (activeMonthChange)="onActiveMonthChanged($event)"
    [min]="min()"
    [max]="max()"
    [locale]="locale()"
    [dateFormatConfig]="dateFormatConfig()"
    [showWeekNumbers]="showWeekNumbers()"
    [highlightWeekends]="highlightWeekends()"
    [markers]="markers()"
    (dateSelected)="dateSelected.emit($event)"
  />

  @if (showTodayMonthFab()) {
    <button type="button" class="coar-date-time-picker-today-fab" (click)="scrollToTodayMonth()" aria-label="Jump to today's month">
      <coar-icon [name]="todayMonthScrollDirection()" size="xs" />
    </button>
  }
</div>
