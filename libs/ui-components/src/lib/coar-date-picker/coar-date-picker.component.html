<div class="coar-date-picker-wrapper">
  <!-- Label -->
  @if (label()) {
    <span class="coar-date-picker-label" [attr.id]="labelId()">
      {{ label() }}
      @if (required()) {
        <span class="coar-date-picker-required" aria-hidden="true">*</span>
      }
    </span>
  }

  <!-- Trigger -->
  <div
    #trigger
    class="coar-date-picker-trigger"
    [class.coar-date-picker-trigger--disabled]="isDisabled()"
    [class.coar-date-picker-trigger--readonly]="readonly()"
    [class.coar-date-picker-trigger--error]="hasError()"
    [class.coar-date-picker-trigger--open]="isOpen()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="'dialog'"
    [attr.aria-controls]="isOpen() ? calendarId() : null"
    role="combobox"
  >
    <!-- Clear Button (left side) - always present to prevent CLS -->
    <coar-icon
      name="x"
      source="coar-builtin"
      size="auto"
      class="coar-date-picker-clear"
      [class.coar-date-picker-clear--hidden]="!showClearButton()"
      aria-hidden="true"
      (click)="clearDate($event)"
    />

    <!-- Date Input -->
    <input
      #dateInput
      type="text"
      class="coar-date-picker-input"
      [attr.id]="inputId()"
      [value]="displayValue()"
      [placeholder]="placeholder() || inputPlaceholder()"
      [disabled]="isDisabled()"
      [readonly]="readonly()"
      [attr.aria-labelledby]="label() ? labelId() : null"
      [attr.aria-invalid]="hasError()"
      autocomplete="off"
      (input)="onInputChange($event)"
      (blur)="onInputBlur()"
      (keydown)="onTriggerKeydown($event)"
    />

    <!-- Calendar Icon (right side) -->
    <button
      type="button"
      class="coar-date-picker-calendar-btn"
      aria-label="Open calendar"
      [disabled]="isDisabled() || readonly()"
      (click)="onTriggerClick()"
    >
      <coar-icon name="calendar" source="coar-builtin" size="sm" />
    </button>
  </div>

  <!-- Calendar Dropdown (rendered via @cocoar/ui-overlay) -->
  <ng-template #calendarTemplate>
    <div class="coar-date-picker-calendar-host" [attr.id]="calendarId()" role="dialog" aria-modal="true" aria-label="Calendar">
      <coar-mini-calendar
        [value]="value()"
        (valueChange)="onMiniCalendarValueChange($event)"
        [min]="min()"
        [max]="max()"
        [locale]="effectiveLocale()"
        [dateFormatConfig]="effectiveDateFormat()"
        [showTodayButton]="showTodayButton()"
        [showWeekNumbers]="showWeekNumbers()"
        [highlightWeekends]="highlightWeekends()"
        [markers]="markers()"
      />
    </div>
  </ng-template>

  <!-- Helper/Error Message -->
  @if (message()) {
    <span class="coar-date-picker-message" [class.coar-date-picker-message--error]="hasError()">
      {{ message() }}
    </span>
  }
</div>
